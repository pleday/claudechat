name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-chat-jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et construction du plugin
        run: ./gradlew test buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: claude-chat
          path: claude-chat-jetbrains/build/distributions/*.zip

  verify:
    # Compatibilité avec les IDE récents : plus lent (télécharge les IDE), donc séparé des tests
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: claude-chat-jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyPlugin
