name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-chat-jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et construction du plugin
        run: ./gradlew test buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: claude-chat
          path: claude-chat-jetbrains/build/distributions/*.zip

  verify:
    # Compatibilité avec les IDE récents : plus lent (télécharge les IDE), donc séparé des tests
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: claude-chat-jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyPlugin

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-chat-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-chat-vscode/package-lock.json
      - run: npm ci
      - name: Types, tests unitaires, construction du .vsix
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: claude-chat-vscode
          path: claude-chat-vscode/*.vsix

  vscode-e2e:
    # Extension chargée dans un vrai VS Code (écran virtuel) avec un faux exécutable claude
    runs-on: ubuntu-latest
    needs: vscode
    defaults:
      run:
        working-directory: claude-chat-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-chat-vscode/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64 libnss3
      - run: xvfb-run -a npm run test:e2e
